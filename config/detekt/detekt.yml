complexity:
  LongMethod:
    active: true
    threshold: 21
    excludes: ['**/test/**']

style:
  # el parser corta con return apenas falla algo
  ReturnCount:
    max: 4

  MagicNumber:
    active: true

  # el while de precedencia sale por 4 break
  LoopWithTooManyJumpStatements:
    maxJumpCount: 4
